[package]
name = "gpui-mobile-example"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GPUI example app for Android and iOS"
publish = false

[lib]
name = "gpui_mobile_example"
crate-type = ["cdylib", "staticlib", "lib"]
path = "src/lib.rs"

[[bin]]
name = "gpui-example"
path = "src/main.rs"

[dependencies]
# Pin the mobile facade support without requiring a published crate. The fork's
# `mobile` branch is v0.8.1 plus fixes not yet in longbridge/gpui-kit.
gpui-kit = { git = "https://github.com/zhu0210/gpui-kit", rev = "aa705a178892be00f714bd70f6c4added25155bf", default-features = false, features = ["component"] }
gpui-mobile = { package = "gpui-pre-mobile", path = "..", version = "0.1.0", features = ["media"] }
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.10" }
reqwest = { package = "gpui-pre-reqwest", version = "0.12.15", default-features = false, features = ["rustls-tls"] }
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
android-activity = { version = "0.6", features = ["native-activity"] }

# `gpui-mobile`'s `media` feature draws video frames through the vendored
# `gpui-pre-wgpu`'s external textures.
[patch.crates-io]
gpui-pre-wgpu = { path = "../vendor/gpui-pre-wgpu" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
