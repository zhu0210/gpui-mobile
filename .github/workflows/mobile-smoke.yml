name: Mobile smoke tests

# Builds the example app, launches it on an Android emulator and an iOS
# simulator, and uploads screenshots and logs. Look at the screenshots: a
# launch that does not crash can still draw nothing.

on:
  push:
    branches: [gpui-pre-0.3.10, gpui-pre-0.3.11]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android-emulator:
    name: Android emulator (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # API 30 images have no Vulkan, and gpui-pre-wgpu cannot render on GLES 3.0.
        api: [34]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build the x86_64 library
        working-directory: example
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo ndk -t x86_64 -P 26 -o android/gradle/app/src/main/jniLibs build --release

      - name: Assemble the APK
        working-directory: example/android/gradle
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-api${{ matrix.api }}-smoke
          path: smoke/
          retention-days: 14

  ios-simulator:
    name: iOS simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example

      - uses: actions/cache@v4
        with:
          path: target/ffmpeg-ios/simulator
          key: ffmpeg-ios-simulator-${{ hashFiles('scripts/build-ffmpeg-ios.sh') }}

      # LGPL FFmpeg with VideoToolbox, for `media::Backend::Ffmpeg`.
      - name: Build FFmpeg
        run: |
          [ -d target/ffmpeg-ios/simulator/Frameworks ] || scripts/build-ffmpeg-ios.sh simulator
          dir="$GITHUB_WORKSPACE/target/ffmpeg-ios/simulator"
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          echo "FFMPEG_LDFLAGS=-L$dir/lib -lavutil -lswresample -lswscale -lavcodec -lavformat" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim=-isysroot $(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        working-directory: example/ios
        run: brew install xcodegen && xcodegen generate --spec project.yml

      - name: Build the Rust library
        working-directory: example
        run: |
          cargo build --lib --target aarch64-apple-ios-sim --features ffmpeg
          ls -la target/aarch64-apple-ios-sim/debug/*.a

      - name: Build for the simulator
        working-directory: example/ios
        run: |
          xcodebuild -project GpuiExample.xcodeproj -scheme GpuiExample \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ENABLE_USER_SCRIPT_SANDBOXING=NO \
            GPUI_CARGO_FEATURES=ffmpeg FFMPEG_DIR="$FFMPEG_DIR" FFMPEG_LDFLAGS="$FFMPEG_LDFLAGS" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Launch on the simulator
        run: |
          set -uo pipefail
          mkdir -p smoke
          app=example/ios/build/Build/Products/Debug-iphonesimulator/GpuiExample.app
          sim=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$sim"
          xcrun simctl bootstatus "$sim" -b
          # Light mode: the dark menu must still get light status bar text.
          xcrun simctl ui "$sim" appearance light
          xcrun simctl install "$sim" "$app"
          xcrun simctl launch "$sim" dev.gpui.mobile.example
          sleep 20
          xcrun simctl io "$sim" screenshot smoke/screenshot.png
          xcrun simctl spawn "$sim" log show --last 3m --style compact \
            --predicate 'process == "GpuiExample"' > smoke/log.txt || true
          # Capture first: `grep -q` exits early, and with pipefail the SIGPIPE it
          # leaves `launchctl` fails the check while the app is running.
          services=$(xcrun simctl spawn "$sim" launchctl list)
          if ! grep -q dev.gpui.mobile.example <<<"$services"; then
            echo "::error::the example app is not running after launch"
            tail -40 smoke/log.txt
            exit 1
          fi
          # The in-scene video screen (`gpui_mobile::media`), opened directly.
          xcrun simctl terminate "$sim" dev.gpui.mobile.example || true
          SIMCTL_CHILD_GPUI_INITIAL_SCREEN=native_video xcrun simctl launch "$sim" dev.gpui.mobile.example
          sleep 15
          xcrun simctl io "$sim" screenshot smoke/native-video.png
          xcrun simctl spawn "$sim" log show --last 1m --style compact \
            --predicate 'process == "GpuiExample"' > smoke/native-video-log.txt || true
          grep -E "video:|panic" smoke/native-video-log.txt | tail -20 || true
          # The rotated clip, turned by the track's transform.
          xcrun simctl terminate "$sim" dev.gpui.mobile.example || true
          SIMCTL_CHILD_GPUI_INITIAL_SCREEN=native_video SIMCTL_CHILD_GPUI_VIDEO_CLIP=1 \
            xcrun simctl launch "$sim" dev.gpui.mobile.example
          sleep 15
          xcrun simctl io "$sim" screenshot smoke/native-video-rotated.png
          xcrun simctl spawn "$sim" log show --last 1m --style compact \
            --predicate 'process == "GpuiExample"' | grep -E "video:|panic" | tail -20 || true
          # A stream over HTTPS (Big Buck Bunny), through `VideoFrames::open_url`.
          xcrun simctl terminate "$sim" dev.gpui.mobile.example || true
          SIMCTL_CHILD_GPUI_INITIAL_SCREEN=native_video SIMCTL_CHILD_GPUI_VIDEO_CLIP=2 \
            xcrun simctl launch "$sim" dev.gpui.mobile.example
          sleep 25
          xcrun simctl io "$sim" screenshot smoke/native-video-stream.png
          xcrun simctl spawn "$sim" log show --last 1m --style compact \
            --predicate 'process == "GpuiExample"' | grep -E "video:|panic" | tail -20 || true
          # FFmpeg (GPUI_VIDEO_BACKEND 1: VideoToolbox, 2: software), plain and rotated.
          # Clips 3 and 4: the 60 s clip through a Rust reader, and AES-128 HLS
          # whose playlist, key and segments Rust serves (open_reader, open_hls).
          # Clip 5 (two audio and two subtitle tracks) with GPUI_VIDEO_CONTROLS: 1.5×,
          # the second audio track, the first subtitles, frames capped at 120 px;
          # through AVPlayer only the speed applies.
          for run in "1 0 ffmpeg" "1 1 ffmpeg-rotated" "2 0 ffmpeg-software" "2 1 ffmpeg-software-rotated" "1 3 ffmpeg-reader" "1 4 ffmpeg-hls" "1 5 ffmpeg-tracks" "2 5 ffmpeg-software-tracks" "0 5 platform-tracks"; do
            read -r backend clip name <<<"$run"
            controls=0
            [ "$clip" = 5 ] && controls=1
            xcrun simctl terminate "$sim" dev.gpui.mobile.example || true
            SIMCTL_CHILD_GPUI_INITIAL_SCREEN=native_video SIMCTL_CHILD_GPUI_VIDEO_CLIP=$clip \
              SIMCTL_CHILD_GPUI_VIDEO_BACKEND=$backend SIMCTL_CHILD_GPUI_VIDEO_CONTROLS=$controls xcrun simctl launch \
              --stderr="$PWD/smoke/native-video-$name-stderr.txt" "$sim" dev.gpui.mobile.example
            sleep 15
            xcrun simctl io "$sim" screenshot "smoke/native-video-$name.png"
            xcrun simctl spawn "$sim" log show --last 1m --style compact \
              --predicate 'process == "GpuiExample"' > "smoke/native-video-$name-log.txt" || true
            echo "== $name"
            grep -E "video:|panic" "smoke/native-video-$name-log.txt" | tail -20 || true
            # FFmpeg's own messages go to stderr.
            tail -20 "smoke/native-video-$name-stderr.txt" || true
          done

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-smoke
          path: smoke/
          retention-days: 14

  ios-ipa:
    name: iOS unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: example

      - uses: actions/cache@v4
        with:
          path: target/ffmpeg-ios/device
          key: ffmpeg-ios-device-${{ hashFiles('scripts/build-ffmpeg-ios.sh') }}

      # LGPL FFmpeg with VideoToolbox, for `media::Backend::Ffmpeg`.
      - name: Build FFmpeg
        run: |
          [ -d target/ffmpeg-ios/device/Frameworks ] || scripts/build-ffmpeg-ios.sh device
          dir="$GITHUB_WORKSPACE/target/ffmpeg-ios/device"
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          echo "FFMPEG_LDFLAGS=-L$dir/lib -lavutil -lswresample -lswscale -lavcodec -lavformat" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios=-isysroot $(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        working-directory: example/ios
        run: brew install xcodegen && xcodegen generate --spec project.yml

      - name: Build the Rust library
        working-directory: example
        run: |
          cargo build --lib --target aarch64-apple-ios --release --features ffmpeg
          ls -la target/aarch64-apple-ios/release/*.a

      - name: Build for devices, unsigned
        working-directory: example/ios
        run: |
          xcodebuild -project GpuiExample.xcodeproj -scheme GpuiExample \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build ENABLE_USER_SCRIPT_SANDBOXING=NO \
            GPUI_CARGO_FEATURES=ffmpeg FFMPEG_DIR="$FFMPEG_DIR" FFMPEG_LDFLAGS="$FFMPEG_LDFLAGS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          ls build/Build/Products/Release-iphoneos/GpuiExample.app/Frameworks

      # SideStore signs it on the device.
      - name: Package the IPA
        run: |
          mkdir -p ipa/Payload
          cp -R example/ios/build/Build/Products/Release-iphoneos/GpuiExample.app ipa/Payload/
          (cd ipa && zip -qr GpuiExample-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v7
        with:
          name: GpuiExample-unsigned.ipa
          path: ipa/GpuiExample-unsigned.ipa
          retention-days: 14
