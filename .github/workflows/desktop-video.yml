name: Desktop video

# Builds `media` with FFmpeg for macOS and Windows, runs its tests and plays the
# bundled clips in a GPUI window: by the platform decoder, in software, and a
# clip recorded on its side. Uploads a screenshot and the log of each. Look at
# them: the runners' GPUs are virtual, so the log says which path a frame took
# (Windows runners have no video decoder, so only software frames show there).

on:
  push:
    branches: [gpui-pre-0.3.11]
    paths:
      - src/media/**
      - vendor/**
      - examples/desktop_video.rs
      - Cargo.toml
      - .github/workflows/desktop-video.yml
      - .github/scripts/screenshot.ps1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  play:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg pkg-config

      # BtbN's LGPL shared build, the one ffmpeg.org points Windows users to.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip
          7z x -y ffmpeg.zip -offmpeg-dist > /dev/null
          dir=$(cygpath -w "$(ls -d "$PWD"/ffmpeg-dist/*)")
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir\\bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Tests
        run: cargo test --lib --no-default-features --features ffmpeg media

      - name: Build the player
        # macOS: GPUI compiles its Metal shaders when it starts, so the runner needs no Metal toolchain.
        run: cargo build --example desktop_video --no-default-features --features ffmpeg${{ runner.os == 'macOS' && ',gpui_platform/runtime_shaders' || '' }}

      - name: Play
        run: |
          mkdir -p out
          failed=0
          play() {
            name=$1
            shift
            GPUI_VIDEO_QUIT_AFTER=12 GPUI_VIDEO_MUTED=1 RUST_LOG=info target/debug/examples/desktop_video "$@" > "out/$name.log" 2>&1 &
            pid=$!
            sleep 7
            if [ "$RUNNER_OS" = macOS ]; then
              screencapture -x "out/$name.png" || true
            else
              powershell -ExecutionPolicy Bypass -File .github/scripts/screenshot.ps1 "$(cygpath -w "$PWD/out/$name.png")" || true
            fi
            if ! wait "$pid"; then
              echo "::error::$name showed no frame, or crashed"
              failed=1
            fi
            grep -E "video:|frames shown|panicked" "out/$name.log" || true
          }
          clips=example/assets/video
          play hardware $clips/av-60s-640x360.mp4
          play software $clips/av-60s-640x360.mp4 software
          play turned $clips/rotated-90.mp4
          play tracks $clips/tracks.mp4 reader
          exit $failed

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-video-${{ matrix.os }}
          path: out
