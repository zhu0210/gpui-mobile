name: CI — Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Host check + unit tests (macOS — needed for iOS SDK headers)
  # ─────────────────────────────────────────────────────────────────────────────
  host:
    name: Host Check & Tests
    runs-on: macos-14 # Apple Silicon runner — has Xcode + iOS SDKs
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: host-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: host-cargo-

      - name: cargo check (host)
        run: cargo check --all-targets

      - name: cargo test (unit tests)
        run: cargo test --tests

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS cross-compilation
  # ─────────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS Application (${{ matrix.label }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            label: device
            destination: generic/platform=iOS
          - target: aarch64-apple-ios-sim
            label: simulator
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            example/target
          key: ios-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'example/Cargo.lock', 'example/Cargo.toml') }}
          restore-keys: ios-${{ matrix.target }}-cargo-

      - name: cargo check — gpui-mobile (${{ matrix.label }})
        run: cargo check --target ${{ matrix.target }}

      - name: Generate iOS application
        run: |
          brew install xcodegen
          xcodegen generate --spec example/ios/project.yml

      - name: Build and link iOS application (${{ matrix.label }})
        run: |
          xcodebuild -project example/ios/GpuiExample.xcodeproj \
            -scheme GpuiExample -configuration Debug \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/gpui-example-${{ matrix.label }}" \
            CODE_SIGNING_ALLOWED=NO build

      - name: Smoke test GPUI video on an iPhone simulator
        if: matrix.label == 'simulator'
        timeout-minutes: 8
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          output = Path(os.environ["RUNNER_TEMP"]) / "gpui-ios-playback"
          output.mkdir()
          app = Path(os.environ["RUNNER_TEMP"]) / "gpui-example-simulator/Build/Products/Debug-iphonesimulator/GpuiExample.app"
          assert app.is_dir(), f"Missing simulator app: {app}"

          def simctl(*args, timeout=30):
              result = subprocess.run(["xcrun", "simctl", *args], capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  raise RuntimeError(f"simctl {args}: {result.stdout} {result.stderr}")
              return result.stdout

          inventory = json.loads(simctl("list", "devices", "available", "--json"))
          runtime, device = next(
              (runtime, device)
              for runtime, devices in inventory["devices"].items()
              for device in devices
              if ".iOS-" in runtime and device.get("isAvailable") and device["name"].startswith("iPhone")
          )
          udid = simctl("create", "GPUI playback CI", device["deviceTypeIdentifier"], runtime).strip()
          (output / "simulator.json").write_text(json.dumps({"udid": udid, "runtime": runtime, "device": device}, indent=2))
          app_pid = None

          def read_app_log():
              raw = simctl("spawn", udid, "log", "show", "--style", "json", "--last", "5m",
                           "--info", "--debug", "--predicate", 'process == "GpuiExample"')
              (output / "app-log.json").write_text(raw)
              events = json.loads(raw)
              messages = "\n".join(event.get("eventMessage", "") for event in events)
              (output / "app-log.txt").write_text(messages)
              return events, messages

          def check_playback():
              global app_pid
              events, messages = read_app_log()
              assert not re.search(r"GPUI PANIC|panicked at|terminating app due to uncaught exception", messages, re.I), messages
              for event in events:
                  if "Initial screen: VideoPlayer" in event.get("eventMessage", ""):
                      app_pid = int(event["processID"])
                      break
              if app_pid is not None:
                  os.kill(app_pid, 0)  # Simulator app PIDs belong to the macOS host.
              return all(marker in messages for marker in (
                  "Initial screen: VideoPlayer",
                  "iOS wgpu renderer created (Metal)",
                  "First video frame prepared for GPU rendering",
              ))

          try:
              simctl("boot", udid)
              simctl("bootstatus", udid, "-b", timeout=180)
              simctl("install", udid, str(app), timeout=60)
              # Cold URL launch exercises normal app routing and autoplay.
              simctl("openurl", udid, "gpui://video_player")
              deadline = time.monotonic() + 60
              while not check_playback():
                  assert time.monotonic() < deadline, "No GPUI video frame within 60 seconds; inspect app-log.txt"
                  time.sleep(2)
              simctl("io", udid, "screenshot", str(output / "playback-start.png"))
              for _ in range(5):
                  time.sleep(2)
                  assert check_playback(), "Playback diagnostics disappeared"
              simctl("io", udid, "screenshot", str(output / "playback-after-10s.png"))
              print("GPUI Metal renderer and video frame observed; app survived 10 seconds of playback.")
          finally:
              # Keep evidence on failure, and remove only the simulator created here.
              try:
                  read_app_log()
                  simctl("io", udid, "screenshot", str(output / "final.png"))
              finally:
                  try:
                      simctl("shutdown", udid)
                  finally:
                      simctl("delete", udid)
          PY

      - name: Upload iOS playback evidence
        if: always() && matrix.label == 'simulator'
        uses: actions/upload-artifact@v7
        with:
          name: gpui-example-ios-playback
          path: ${{ runner.temp }}/gpui-ios-playback
          if-no-files-found: error

      - name: Upload iOS application (${{ matrix.label }})
        uses: actions/upload-artifact@v7
        with:
          name: gpui-example-ios-${{ matrix.label }}
          path: ${{ runner.temp }}/gpui-example-${{ matrix.label }}/Build/Products/Debug-*/GpuiExample.app
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Android cross-compilation
  # ─────────────────────────────────────────────────────────────────────────────
  android:
    name: Android Build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Resolve NDK path
        run: |
          sdkmanager "ndk;29.0.14206865" "platforms;android-37.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: android-cargo-

      - name: cargo check — gpui-mobile (Android aarch64)
        run: cargo ndk -t arm64-v8a check --locked

      - name: cargo check — example app (Android aarch64)
        working-directory: example
        run: cargo ndk -t arm64-v8a check --locked

  # ─────────────────────────────────────────────────────────────────────────────
  # Android APK build (Gradle)
  # ─────────────────────────────────────────────────────────────────────────────
  android-apk:
    name: Android APK (Gradle)
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v6

      - name: Check out Lumina Android bridge
        uses: actions/checkout@v6
        with:
          repository: zhu0210/lumina-video-gpui
          ref: 7a7b6149956a4a646e7517d0f1c2106f1669f88d
          path: .dependencies/lumina-video

      - name: Install Rust toolchain + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Resolve NDK path
        run: |
          sdkmanager "ndk;29.0.14206865" "platforms;android-37.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Cargo registry + git deps
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            example/target
          key: android-apk-cargo-${{ hashFiles('example/Cargo.lock', 'example/Cargo.toml') }}
          restore-keys: android-apk-cargo-

      - name: Build Rust shared library via cargo-ndk
        working-directory: example
        run: |
          cargo ndk \
            -t arm64-v8a \
            -P 26 \
            --link-libcxx-shared \
            -o android/gradle/app/src/main/jniLibs \
            build --locked

      - name: Assemble debug APK
        working-directory: example/android/gradle
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpui-example-debug.apk
          path: example/android/gradle/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
