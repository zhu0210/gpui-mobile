[package]
name = "gpui-pre-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Balamurali Pandranki <balamurali@live.com>"]
license = "GPL-3.0-or-later OR AGPL-3.0-or-later OR Apache-2.0"
description = "Mobile platform support for GPUI — iOS (wgpu/Metal) and Android (wgpu/Vulkan)"
repository = "https://github.com/longbridge/gpui-mobile"
homepage = "https://github.com/longbridge/gpui-mobile"
keywords = ["gui", "mobile", "ios", "android", "gpui"]
categories = ["gui", "os"]
readme = "README.md"

[features]
default = ["url_launcher", "shared_preferences", "path_provider",
           "package_info", "device_info", "connectivity", "network_info", "vibration",
           "battery", "share", "sensors", "webview", "file_selector", "image_picker", "camera",
           "permission_handler", "notifications", "location", "audio",
           "clipboard", "local_auth", "in_app_review", "contacts", "maps_launcher",
           "calendar", "deeplink", "microphone", "maps", "media_session"]
url_launcher = []
shared_preferences = []
path_provider = []
package_info = []
device_info = []
connectivity = []
network_info = []
vibration = []
battery = []
share = []
sensors = []
webview = []
file_selector = []
image_picker = []
camera = []
permission_handler = []
notifications = []
location = []
audio = []
clipboard = []
local_auth = []
in_app_review = []
contacts = []
maps_launcher = []
maps = []
calendar = []
deeplink = []
microphone = []
media_session = []
# Render GPUI windows into images (`gpui_mobile::offscreen`). Needs the vendored
# `gpui-pre-wgpu` (see `[patch.crates-io]`), which exposes its headless renderer.
offscreen = ["gpui_wgpu/offscreen", "dep:image"]
# Video frames decoded by the platform and drawn in the GPUI scene without CPU
# copies (`gpui_mobile::media`). Needs the vendored `gpui-pre-wgpu` too.
media = ["dep:image"]
# FFmpeg as a `media` source (`media::Backend::Ffmpeg`): its demuxers, the
# platform decoder through FFmpeg's hwaccel, software decoding as the fallback.
# Links FFmpeg's shared libraries: the system's on Linux (VA-API decoding);
# for phones build them with `scripts/build-ffmpeg-android.sh` or
# `scripts/build-ffmpeg-ios.sh` and set FFMPEG_DIR.
ffmpeg = ["media", "dep:ffmpeg-next", "dep:cpal"]

[lib]
name = "gpui_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

# ── shared deps (all platforms) ──────────────────────────────────────────────

[dependencies]
anyhow       = "1"
log          = { version = "0.4", features = ["kv_unstable_serde", "serde"] }
parking_lot  = "0.12"
futures      = "0.3"
raw-window-handle = "0.6"
# Same major version as `gpui-pre-wgpu`, whose `RgbaImage` `offscreen` returns.
image        = { version = "0.25", default-features = false, optional = true }

# ── GPUI core crate (provides Platform trait, event types, geometry, etc.) ───
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }

# ── iOS ──────────────────────────────────────────────────────────────────────

[target.'cfg(target_os = "ios")'.dependencies]
# Objective-C runtime
objc2 = "0.6"

# Apple frameworks
core-foundation     = "0.10"
core-foundation-sys = "0.8"
core-graphics       = "0.24"
core-text           = "=21.0.0"
uuid                = { version = "1", features = ["v4", "v5"] }
block2              = "0.6"
# Wrapping IOSurface-backed video frames for wgpu (`media`); the version wgpu-hal uses.
objc2-metal         = "0.3"

# libc 0.2.190 dropped the iOS `_dyld_*` symbol declarations that `backtrace`
# calls in `symbolize/gimli/libs_macos.rs`, which breaks `cargo check` for the
# apple-ios targets (E0425: cannot find `_dyld_image_header` in `libc`). Pin to
# the last good release until a fixed libc (>0.2.190) ships.
libc = "=0.2.189"

# wgpu renderer (Metal backend on iOS/Android)
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.10", features = ["font-kit"] }

# Text / font stack
pathfinder_geometry = "0.5"
smallvec            = { version = "1.6", features = ["union", "const_new"] }

# font-kit (same registry package as gpui-pre-wgpu)
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "linux"))'.dependencies]
# FFmpeg for `media` (feature `ffmpeg`): LGPL shared libraries, no avdevice/avfilter.
ffmpeg-next = { version = "=9.0.0", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }

# ── Linux desktop (`media` with `ffmpeg`) ────────────────────────────────────

[target.'cfg(target_os = "linux")'.dependencies]
# The `media` clock reads CLOCK_MONOTONIC, like the audio timestamps.
libc = "0.2"
# Audio output for the FFmpeg backend; also covers macOS and Windows later.
cpal = { version = "0.16", optional = true }
# The window's wgpu context and the external-texture hook (`media`).
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.10" }

# ── Android ──────────────────────────────────────────────────────────────────

[target.'cfg(target_os = "android")'.dependencies]
# JNI / NDK bindings
jni         = "0.22"
libc        = "0.2"
# Keep `ndk` on the baseline `nativewindow` feature set. Enabling
# `api-level-31` links API 31 symbols directly, so the shared library
# fails to `dlopen` on older Android versions before our own code runs.
ndk         = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys     = { version = "0.6", features = ["media", "audio"] }
# Raw Vulkan for importing AHardwareBuffers (`media`); the version wgpu-hal uses.
ash         = "0.38"

# Activity glue layer
android-activity = { version = "0.6", features = ["native-activity"] }

# Logging to logcat
android_logger = "0.15"

# wgpu renderer (Vulkan backend on Android)
# Android uses Cosmic Text and system fonts; font-kit pulls in desktop Fontconfig.
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.10" }

# TalkBack: exposes GPUI's AccessKit tree (accesskit 0.24, as gpui-pre).
accesskit_android = "0.7.5"

# rustc-hash is required by the PlatformKeyboardMapper trait signature
rustc-hash = "2"
uuid       = { version = "1", features = ["v5"] }

# ── dev ──────────────────────────────────────────────────────────────────────

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false, features = ["test-support"] }

# `examples/desktop_video.rs`: a desktop GPUI window.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["wayland", "x11"] }
env_logger = "0.11"

[[example]]
name = "desktop_video"
required-features = ["ffmpeg"]

# ── profiles ─────────────────────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

[profile.dev]
opt-level = 0
debug     = true

# `gpui-pre-wgpu` 0.3.10 with its headless renderer behind an `offscreen` feature
# instead of `test-support` / `bench-support`, a constructor that takes the wgpu
# instance (iOS needs Metal), and methods that release its render target and
# clear its sprite atlas between captures. Applications that enable `offscreen`
# must patch it the same way.
[patch.crates-io]
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
